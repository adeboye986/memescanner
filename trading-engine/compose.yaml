name: meme-scanner-trading-engine

x-engine-common: &engine-common
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://trading_engine:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/trading_engine
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: trading_engine
      POSTGRES_USER: trading_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_engine -d trading_engine"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - engine-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - engine-redis:/data

  api:
    <<: *engine-common
    command: ["node", "dist/apps/api/src/main.js"]
    ports:
      - "127.0.0.1:${PORT:-3100}:3100"

  worker:
    <<: *engine-common
    command: ["node", "dist/apps/worker/src/main.js"]

  scheduler:
    <<: *engine-common
    command: ["node", "dist/apps/scheduler/src/main.js"]

volumes:
  engine-postgres:
  engine-redis:
